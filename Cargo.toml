[package]
name = "feather-chat"
version = "1.1.0"
edition = "2021"
description = "A featherweight chat app with a tiny self-hosted hub and phone client"

[workspace]
members = ["core"]

[dependencies]
feather-core = { path = "core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = "0.4"
winit = { version = "0.30", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
